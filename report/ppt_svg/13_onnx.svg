  <g id="independence" data-pptx-bounds="904 168 304 250">
    <rect x="904" y="168" width="304" height="250" rx="10" fill="#131C2E" stroke="#1E3050" stroke-width="1"/>
    <text x="928" y="204" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#E6EDF7">独立实现</text>
    <line x1="928" y1="218" x2="1184" y2="218" stroke="#1E3050" stroke-width="1"/>
    <text x="928" y="252" font-family="Microsoft YaHei" font-size="15" fill="#93A4C0">部署侧用 PIL 手写</text>
    <text x="928" y="276" font-family="Consolas" font-size="14" fill="#35D0F0">resize + crop + normalize</text>
    <text x="928" y="302" font-family="Microsoft YaHei" font-size="15" fill="#93A4C0">不 import torchvision</text>
    <line x1="928" y1="322" x2="1184" y2="322" stroke="#1E3050" stroke-width="1"/>
    <text x="928" y="352" font-family="Microsoft YaHei" font-size="14" fill="#FFC857">为什么必须独立</text>
    <text x="928" y="378" font-family="Microsoft YaHei" font-size="13" fill="#93A4C0">共用一份 transform，两<tspan x="928" dy="20">端口径完全一样，误差会一直</tspan><tspan x="928" dy="20">是 0，反而看不出预处理写错</tspan></text>
  </g>

  <g id="consistency" data-pptx-bounds="72 434 800 218">
    <rect x="72" y="434" width="800" height="218" rx="10" fill="#0F1728" stroke="#1E3050" stroke-width="1"/>
    <text x="100" y="470" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#E6EDF7">PyTorch 与 ONNX 一致性（固定划分列表、真实图片）</text>
    <line x1="100" y1="484" x2="844" y2="484" stroke="#1E3050" stroke-width="1"/>

    <g id="c-1">
      <text x="100" y="522" font-family="Microsoft YaHei" font-size="15" fill="#93A4C0">最大 logits 绝对误差</text>
      <text x="450" y="522" font-family="Consolas" font-size="16" fill="#3FDB9B" text-anchor="end">6.199e-06</text>
    </g>
    <g id="c-2">
      <text x="100" y="554" font-family="Microsoft YaHei" font-size="15" fill="#93A4C0">平均 logits 绝对误差</text>
      <text x="450" y="554" font-family="Consolas" font-size="16" fill="#3FDB9B" text-anchor="end">1.501e-06</text>
    </g>
    <g id="c-3">
      <text x="100" y="586" font-family="Microsoft YaHei" font-size="15" fill="#93A4C0">Top-1 一致率（推荐 ≥0.99）</text>
      <text x="450" y="586" font-family="Consolas" font-size="16" font-weight="bold" fill="#3FDB9B" text-anchor="end">100.00%</text>
    </g>
    <g id="c-4">
      <text x="100" y="618" font-family="Microsoft YaHei" font-size="15" fill="#93A4C0">Top-5 集合一致率</text>
      <text x="450" y="618" font-family="Consolas" font-size="16" fill="#3FDB9B" text-anchor="end">100.00%</text>
    </g>
    <text x="500" y="522" font-family="Microsoft YaHei" font-size="14" fill="#93A4C0">3 个模型各 12 张全部 PASS；<tspan x="500" dy="24">这 12 张图上未观察到九类</tspan><tspan x="500" dy="24">典型问题的表现，不等于已</tspan><tspan x="500" dy="24">排除九类问题</tspan><tspan x="500" dy="24">（只覆盖已测输入）</tspan></text>
  </g>

  <g id="label-discipline" data-pptx-bounds="904 434 304 218">
    <rect x="904" y="434" width="304" height="218" rx="10" fill="#1A1408" stroke="#FFC857" stroke-width="1"/>
    <text x="928" y="470" font-family="Microsoft YaHei" font-size="17" font-weight="bold" fill="#FFC857">标签绝不混用</text>
    <line x1="928" y1="484" x2="1184" y2="484" stroke="#3A2E12" stroke-width="1"/>
    <text x="928" y="516" font-family="Consolas" font-size="14" fill="#93A4C0">1000 类 → imagenet<tspan x="928" dy="26">37 类　 → pet</tspan></text>
    <line x1="928" y1="562" x2="1184" y2="562" stroke="#3A2E12" stroke-width="1"/>
    <text x="928" y="592" font-family="Microsoft YaHei" font-size="13" fill="#93A4C0">registry 的 labels_for(key)<tspan x="928" dy="20">按模型强制选择，行数 ≠</tspan><tspan x="928" dy="20">num_classes 立即断言失败</tspan></text>
  </g>

