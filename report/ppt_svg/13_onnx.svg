  <g id="page-header" data-pptx-bounds="72 44 1136 100">
    <text x="72" y="82" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#E6EDF7">6 个 ONNX 模型；一致性只测了 3 个型号各 12 张</text>
    <text x="72" y="118" font-family="Microsoft YaHei" font-size="16" fill="#93A4C0">文件名一律经 deploy/model_registry.py 的 onnx_path(key) 取得，任何地方不硬写；其余型号只有导出检查与性能结果</text>
    <line x1="72" y1="136" x2="1208" y2="136" stroke="#1E3050" stroke-width="2"/>
  </g>

