  <g id="why-not-linear" data-pptx-bounds="72 458 1136 118">
    <rect x="72" y="458" width="1136" height="118" rx="10" fill="#0F1728" stroke="#1E3050" stroke-width="1"/>
    <text x="100" y="492" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#E6EDF7">为什么更大的模型不一定按 MACs 比例变慢</text>
    <line x1="100" y1="506" x2="1180" y2="506" stroke="#1E3050" stroke-width="1"/>
    <text x="100" y="536" font-family="Microsoft YaHei" font-size="14" fill="#93A4C0">① 小模型受固定开销支配（算子启动、内存分配、线程同步与计算量同量级）</text>
    <text x="100" y="560" font-family="Microsoft YaHei" font-size="14" fill="#93A4C0">② depthwise 卷积算术强度低，瓶颈在内存带宽而非算力　③ 分类头维度差异被放大：37 类的 Gemm 比 1000 类小得多</text>
  </g>

  <g id="perf-disclaimer" data-pptx-bounds="72 592 1136 60">
    <rect x="72" y="592" width="1136" height="60" rx="10" fill="#1A1408" stroke="#FFC857" stroke-width="1"/>
    <text x="100" y="620" font-family="Microsoft YaHei" font-size="15" fill="#FFC857">mean 易被慢样本拉高；P50 是典型耗时，最适合横向比较；P95 反映尾延迟（本机 P95/P50 ≈ 1.09，分布很稳）</text>
    <text x="100" y="642" font-family="Microsoft YaHei" font-size="13" fill="#93A4C0">不同设备 / 后端 / 精度下的延迟不可横向比较；官方 iPhone 12 延迟不得与本机 CPU 结果直接对比</text>
  </g>

