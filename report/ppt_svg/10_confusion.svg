<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="bg-canvas" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220"/>

  <g id="page-header" data-pptx-bounds="72 44 1136 100">
    <text x="72" y="82" font-family="Microsoft YaHei" font-size="34" font-weight="bold" fill="#E6EDF7">模型几乎不混淆猫狗，错误集中在品种之间</text>
    <text x="72" y="118" font-family="Microsoft YaHei" font-size="16" fill="#93A4C0">归一化混淆矩阵 37×37，行和 = 1.0，argmax 落在对角线 37/37 = 100%</text>
    <line x1="72" y1="136" x2="1208" y2="136" stroke="#1E3050" stroke-width="2"/>
  </g>

  <g id="cross-species" data-pptx-bounds="72 168 566 218">
    <rect x="72" y="168" width="566" height="218" rx="10" fill="#0F1728" stroke="#1E3050" stroke-width="1"/>
    <text x="98" y="204" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#E6EDF7">猫狗块分析（关键结论）</text>
    <line x1="98" y1="218" x2="612" y2="218" stroke="#1E3050" stroke-width="1"/>

    <g id="cs-cross">
      <text x="98" y="282" font-family="Consolas" font-size="44" font-weight="bold" fill="#3FDB9B">3.56%</text>
      <text x="98" y="312" font-family="Microsoft YaHei" font-size="15" fill="#93A4C0">跨物种误判占比（10 / 281 个错误）</text>
    </g>
    <g id="cs-within">
      <text x="98" y="366" font-family="Consolas" font-size="24" font-weight="bold" fill="#FFC857">271 个</text>
      <text x="260" y="366" font-family="Microsoft YaHei" font-size="15" fill="#93A4C0">种内品种错误（96.4%）</text>
    </g>
  </g>

  <g id="recall" data-pptx-bounds="646 168 562 218">
    <rect x="646" y="168" width="562" height="218" rx="10" fill="#131C2E" stroke="#1E3050" stroke-width="1"/>
    <text x="672" y="204" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#E6EDF7">猫 / 狗 召回</text>
    <line x1="672" y1="218" x2="1182" y2="218" stroke="#1E3050" stroke-width="1"/>

    <g id="rc-cat">
      <text x="672" y="258" font-family="Microsoft YaHei" font-size="15" fill="#93A4C0">猫召回</text>
      <text x="1182" y="258" font-family="Consolas" font-size="18" font-weight="bold" fill="#35D0F0" text-anchor="end">88.17%</text>
      <rect x="672" y="270" width="510" height="10" rx="5" fill="#1B2740"/>
      <rect x="672" y="270" width="450" height="10" rx="5" fill="#35D0F0"/>
    </g>
    <g id="rc-dog">
      <text x="672" y="318" font-family="Microsoft YaHei" font-size="15" fill="#93A4C0">狗召回</text>
      <text x="1182" y="318" font-family="Consolas" font-size="18" font-weight="bold" fill="#35D0F0" text-anchor="end">94.33%</text>
      <rect x="672" y="330" width="510" height="10" rx="5" fill="#1B2740"/>
      <rect x="672" y="330" width="481" height="10" rx="5" fill="#3FDB9B"/>
    </g>
    <text x="672" y="370" font-family="Microsoft YaHei" font-size="14" fill="#5C7096">猫的召回明显低于狗：长毛猫品种间差异更小</text>
  </g>

  <g id="hard-classes" data-pptx-bounds="72 406 1136 120">
    <rect x="72" y="406" width="1136" height="120" rx="10" fill="#0F1728" stroke="#1E3050" stroke-width="1"/>
    <text x="100" y="440" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#E6EDF7">最难的三类（按 F1 升序）</text>
    <line x1="100" y1="454" x2="1180" y2="454" stroke="#1E3050" stroke-width="1"/>

    <g id="hc-1">
      <text x="100" y="492" font-family="Microsoft YaHei" font-size="15" fill="#E6EDF7">Staffordshire Bull Terrier</text>
      <text x="100" y="514" font-family="Consolas" font-size="15" fill="#FF6B6B">F1 0.696</text>
    </g>
    <g id="hc-2">
      <text x="470" y="492" font-family="Microsoft YaHei" font-size="15" fill="#E6EDF7">American Pit Bull Terrier</text>
      <text x="470" y="514" font-family="Consolas" font-size="15" fill="#FFC857">F1 0.707</text>
    </g>
    <g id="hc-3">
      <text x="840" y="492" font-family="Microsoft YaHei" font-size="15" fill="#E6EDF7">Ragdoll</text>
      <text x="840" y="514" font-family="Consolas" font-size="15" fill="#FFC857">F1 0.745</text>
    </g>
  </g>

  <g id="error-cause" data-pptx-bounds="72 546 1136 104">
    <rect x="72" y="546" width="1136" height="104" rx="10" fill="#131C2E" stroke="#1E3050" stroke-width="1"/>
    <text x="100" y="578" font-family="Microsoft YaHei" font-size="17" font-weight="bold" fill="#E6EDF7">错误来自哪里</text>
    <line x1="100" y1="590" x2="1180" y2="590" stroke="#1E3050" stroke-width="1"/>
    <text x="100" y="618" font-family="Microsoft YaHei" font-size="14" fill="#93A4C0">① 主体外观相似（多数）：斗牛梗类、长毛猫类的品种间差异本身就小</text>
    <text x="100" y="640" font-family="Microsoft YaHei" font-size="14" fill="#93A4C0">② 姿态/视角极端：侧躺、只露头部时判别性部位不可见　③ 背景干扰：主体占比小时注意力分散到背景</text>
  </g>

  <g id="page-footer" data-pptx-bounds="72 662 1136 34">
    <text x="72" y="684" font-family="Microsoft YaHei" font-size="13" fill="#5C7096">数据来源：outputs/confusion_matrix/baseline_cm.png · baseline_per_class.csv · baseline_cat_dog_block.json</text>
    <text x="1208" y="684" font-family="Consolas" font-size="14" fill="#5C7096" text-anchor="end">10</text>
  </g>
</svg>
